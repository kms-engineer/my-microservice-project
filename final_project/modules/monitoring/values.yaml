# Custom values for kube-prometheus-stack.
# Templated values are substituted by Terraform via templatefile().

grafana:
  enabled: true
  adminPassword: "${grafana_admin_password}"
  service:
    type: ${grafana_service_type}
    port: 80
  persistence:
    enabled: true
    storageClassName: ${storage_class}
    size: ${grafana_storage_size}
  defaultDashboardsEnabled: true
  sidecar:
    dashboards:
      enabled: true
    datasources:
      enabled: true

prometheus:
  prometheusSpec:
    retention: ${prometheus_retention}
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: ${storage_class}
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: ${prometheus_storage_size}
    # Discover ServiceMonitors regardless of release label so user apps are picked up automatically.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

alertmanager:
  enabled: true

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true

# Reduce resource pressure on small clusters.
prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
